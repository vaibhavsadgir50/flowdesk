spring.application.name=flowdesk

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flowdesk}
spring.datasource.username=${DB_USER:flowdesk}
spring.datasource.password=${DB_PASSWORD:flowdesk}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

flowdesk.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# AI assistant. Leave the key empty to use the built-in rule-based fallback.
flowdesk.ai.api-key=${LLM_API_KEY:}
flowdesk.ai.base-url=${LLM_BASE_URL:https://api.anthropic.com}
flowdesk.ai.model=${LLM_MODEL:claude-haiku-5-5}
flowdesk.ai.max-tokens=800
